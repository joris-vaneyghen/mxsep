[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mxsep"
version = "0.1.0"
description = "Music Source Separation Toolkit"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Joris Vaneyghen", email = "joris.vaneyghen@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["audio", "source-separation", "deep-learning", "pytorch"]
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchaudio",
    "numpy",
    "librosa",
    "soundfile",
    "hydra-core",
    "torchaudio",
    "torchinfo",
    "torchview",
    "tqdm",
    "wandb",
    "audiomentations",
    "einops",
]

#[project.optional-dependencies]
#data = ["pandas", "tqdm", "scipy"]
#train = [
#    "wandb",
#    "tensorboard",
#    "torch-tb-profiler",
#    "torch-xla>=2.0.0",
#    "fairscale",
#]
#inference = ["onnx", "onnxruntime", "onnx-simplifier"]
#dev = ["pytest", "black", "isort", "mypy", "flake8", "pre-commit"]

[project.urls]
Homepage = "https://github.com/joris-vaneyghen/mxsep"
Repository = "https://github.com/joris-vaneyghen/mxsep"
Documentation = "https://github.com/joris-vaneyghen/mxsep"

[project.scripts]
mxsep-dataset-info = "mxsep.cli.dataset_info:run"
mxsep-model-info = "mxsep.cli.model_info:run"
mxsep-generate-mixes = "mxsep.cli.generate_mixes:run"
mxsep-train = "mxsep.cli.train:run"

[tool.setuptools.package-data]
mxsep = ["configs/*.yaml", "configs/**/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]